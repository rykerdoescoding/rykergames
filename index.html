<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructure</title>

<link rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg-primary: #1a0f0a;
    --bg-secondary: #2a160d;
    --bg-tertiary: #3a1f12;

    --accent-main: #ff7849;
    --accent-alt: #ffb703;

    --text-primary: #fff3e8;
    --text-secondary: #d6bfae;

    --border-radius: 6px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: auto;
}

body {
    font-family: 'Orbitron', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    min-height: 100vh;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 70px;
    background: var(--bg-secondary);
    position: fixed;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--accent-main);
}

.sidebar.expanded {
    width: 200px;
}

.sidebar-header {
    padding: 20px 0;
}

.sidebar-logo {
    font-size: 1.6rem;
    color: var(--accent-main);
}

.sidebar-toggle {
    cursor: pointer;
    margin-top: 15px;
    color: var(--text-primary);
}

.nav-item {
    width: 100%;
    padding: 12px;
    text-decoration: none;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
}

.nav-item.active {
    background: rgba(255, 120, 73, 0.2);
    color: var(--text-primary);
}

.nav-icon {
    width: 40px;
    text-align: center;
}

.nav-text {
    display: none;
}

.sidebar.expanded .nav-text {
    display: inline;
}

/* ================= MAIN ================= */

.main-container {
    margin-left: 70px;
    width: calc(100% - 70px);
}

.sidebar.expanded ~ .main-container {
    margin-left: 200px;
    width: calc(100% - 200px);
}

.app-header {
    background: var(--bg-secondary);
    padding: 15px;
    border-bottom: 1px solid var(--accent-main);
}

.logo {
    font-size: 1.8rem;
    color: var(--accent-main);
}

.time-spent {
    font-size: 0.8rem;
    color: var(--text-secondary);
}

/* ================= SEARCH ================= */

.search-container {
    margin-top: 10px;
}

#searchInput {
    width: 100%;
    padding: 10px;
    background: var(--bg-tertiary);
    border: 1px solid var(--accent-main);
    border-radius: 20px;
    color: var(--text-primary);
}

/* ================= GAME GRID (OPTIMIZED) ================= */

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding: 15px;
}

.game-card {
    background: var(--bg-tertiary);
    border: 1px solid rgba(255,120,73,0.3);
    border-radius: var(--border-radius);
    text-align: center;
    padding: 8px;
}

.game-card a {
    text-decoration: none;
    color: inherit;
}

.game-card-image {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 6px;
    border: 2px solid var(--accent-main);
}

.game-card-title {
    font-size: 0.7rem;
    color: var(--accent-alt);
}

/* FAVORITE STAR (STATIC) */

.favorite-star {
    font-size: 14px;
    color: #aaa;
    cursor: pointer;
}

.favorite-star.active {
    color: #ffd700;
}

/* ================= FOOTER ================= */

footer {
    background: var(--bg-secondary);
    padding: 20px;
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--accent-main);
}
</style>
</head>

<body>

<nav class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-gamepad"></i></div>
        <div class="sidebar-toggle"><i class="fas fa-chevron-right"></i></div>
    </div>

    <a href="#home" class="nav-item active" data-page="home">
        <div class="nav-icon"><i class="fas fa-home"></i></div>
        <div class="nav-text">Home</div>
    </a>

    <a href="#settings" class="nav-item" data-page="settings">
        <div class="nav-icon"><i class="fas fa-cog"></i></div>
        <div class="nav-text">Settings</div>
    </a>
</nav>

<div class="main-container">
<header class="app-header">
    <div class="logo">rykerdoescoding</div>
    <div class="time-spent" id="timeSpent">loading...</div>

    <div class="search-container">
        <input id="searchInput" placeholder="Search games..." onkeyup="searchGames()">
    </div>
</header>

<main>
    <div class="games-grid" id="all-games-grid"></div>
</main>

<footer>
    © <span id="year"></span> rykerdoescoding
</footer>
</div>

<script>
/* ================= SIDEBAR ================= */
document.querySelector('.sidebar-toggle').onclick = () => {
    document.querySelector('.sidebar').classList.toggle('expanded');
};

/* ================= GAMES ================= */
async function loadGames() {
    try {
        const res = await fetch('games.json');
        const data = await res.json();
        return data.games || [];
    } catch {
        return [];
    }
}

function getFavorites() {
    return JSON.parse(localStorage.getItem('favoriteGames') || '[]');
}

function saveFavorites(favs) {
    localStorage.setItem('favoriteGames', JSON.stringify(favs));
}

function toggleFavorite(e, game) {
    e.stopPropagation();
    let favs = getFavorites();
    const index = favs.findIndex(f => f.path === game.path);

    if (index === -1) favs.push(game);
    else favs.splice(index, 1);

    saveFavorites(favs);
    renderGames(window.ALL_GAMES);
}

function renderGames(games) {
    const grid = document.getElementById('all-games-grid');
    grid.innerHTML = '';
    const favs = getFavorites();

    for (const game of games) {
        const isFav = favs.some(f => f.path === game.path);
        const card = document.createElement('div');
        card.className = 'game-card';

        card.innerHTML = `
            <a href="${game.path}" target="_blank">
                <img src="${game.image}" class="game-card-image">
                <div class="game-card-title">${game.title}</div>
            </a>
            <div class="favorite-star ${isFav ? 'active' : ''}">
                <i class="fa${isFav ? 's' : 'r'} fa-star"></i>
            </div>
        `;

        card.querySelector('.favorite-star').onclick = (e) =>
            toggleFavorite(e, game);

        grid.appendChild(card);
    }
}

async function searchGames() {
    const q = searchInput.value.toLowerCase();
    renderGames(window.ALL_GAMES.filter(g =>
        g.title.toLowerCase().includes(q)
    ));
}

/* ================= TIME ================= */
let seconds = Number(localStorage.getItem('time') || 0);
setInterval(() => {
    seconds++;
    localStorage.setItem('time', seconds);
    timeSpent.textContent = seconds + ' seconds';
}, 1000);

/* ================= INIT ================= */
document.getElementById('year').textContent = new Date().getFullYear();

(async () => {
    window.ALL_GAMES = await loadGames();
    renderGames(window.ALL_GAMES);
})();
</script>

</body>
</html>
