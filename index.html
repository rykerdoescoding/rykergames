<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolphinator</title>

<link rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg-primary: #0d0a1a;
    --bg-secondary: rgba(20, 10, 40, 0.8);
    --bg-tertiary: rgba(40, 20, 60, 0.7);

    --accent-main: #7f5af0;
    --accent-alt: #00f0ff;

    --text-primary: #e0e0ff;
    --text-secondary: #a0a0ff;

    --border-radius: 12px;
    --glow: 0 0 15px rgba(127,90,240,0.6), 0 0 30px rgba(0,240,255,0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #0d0a1a, #1a0f2f, #0a1a3a);
    color: var(--text-primary);
    display: flex;
    min-height: 100vh;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 70px;
    background: var(--bg-secondary);
    position: fixed;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--accent-main);
    transition: width 0.3s ease;
    backdrop-filter: blur(10px);
}

.sidebar.expanded {
    width: 220px;
}

.sidebar-header {
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.sidebar-logo {
    font-size: 1.8rem;
    color: var(--accent-main);
    text-shadow: var(--glow);
}

.sidebar-toggle {
    cursor: pointer;
    margin-top: 15px;
    color: var(--text-primary);
}

.nav-item {
    width: 100%;
    padding: 12px;
    text-decoration: none;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    transition: all 0.2s ease;
    border-radius: var(--border-radius);
    margin: 5px 0;
}

.nav-item:hover, .nav-item.active {
    background: rgba(127,90,240,0.2);
    color: var(--text-primary);
    text-shadow: var(--glow);
}

.nav-icon {
    width: 40px;
    text-align: center;
}

.nav-text {
    display: none;
}

.sidebar.expanded .nav-text {
    display: inline;
}

/* ================= MAIN ================= */

.main-container {
    margin-left: 70px;
    width: calc(100% - 70px);
    transition: margin-left 0.3s ease, width 0.3s ease;
}

.sidebar.expanded ~ .main-container {
    margin-left: 220px;
    width: calc(100% - 220px);
}

.app-header {
    background: var(--bg-secondary);
    padding: 15px;
    border-bottom: 1px solid var(--accent-main);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.logo {
    font-size: 2rem;
    color: var(--accent-main);
    text-shadow: var(--glow);
}

.time-spent {
    font-size: 0.9rem;
    color: var(--text-secondary);
}

/* ================= SEARCH ================= */

.search-container {
    margin-top: 10px;
}

#searchInput {
    width: 100%;
    padding: 10px 15px;
    background: rgba(60, 30, 90, 0.5);
    border: 1px solid var(--accent-alt);
    border-radius: 25px;
    color: var(--text-primary);
    outline: none;
    transition: all 0.3s ease;
}

#searchInput:focus {
    border-color: var(--accent-main);
    box-shadow: var(--glow);
}

/* ================= GRID ================= */

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 15px;
    padding: 20px;
}

.section-title {
    padding: 15px 20px 5px;
    color: var(--accent-main);
    font-size: 1.2rem;
    text-shadow: var(--glow);
}

/* ================= GAME CARDS ================= */

.game-card {
    background: var(--bg-tertiary);
    border-radius: var(--border-radius);
    text-align: center;
    padding: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(127,90,240,0.3);
    backdrop-filter: blur(5px);
}

.game-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--glow);
}

.game-card.selected {
    border-color: var(--accent-main);
    box-shadow: 0 0 20px var(--accent-main), 0 0 40px var(--accent-alt);
}

.game-card a {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.game-card-image {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 8px;
    border: 2px solid var(--accent-main);
    transition: transform 0.2s ease;
}

.game-card:hover .game-card-image {
    transform: scale(1.1);
}

.game-card-title {
    font-size: 0.8rem;
    color: var(--accent-alt);
    text-shadow: 0 0 5px var(--accent-alt);
}

.favorite-star {
    font-size: 16px;
    color: #aaa;
    cursor: pointer;
    position: absolute;
    top: 8px;
    right: 8px;
}

.favorite-star.active {
    color: #ffd700;
}

/* ================= FOOTER ================= */

footer {
    background: var(--bg-secondary);
    padding: 20px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-secondary);
    border-top: 1px solid var(--accent-main);
    backdrop-filter: blur(10px);
}
</style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-gamepad"></i></div>
        <div class="sidebar-toggle"><i class="fas fa-chevron-right"></i></div>
    </div>

    <a href="#home" class="nav-item active">
        <div class="nav-icon"><i class="fas fa-home"></i></div>
        <div class="nav-text">Home</div>
    </a>

    <a href="#settings" class="nav-item">
        <div class="nav-icon"><i class="fas fa-cog"></i></div>
        <div class="nav-text">Settings</div>
    </a>
</nav>

<div class="main-container">

<header class="app-header">
    <div class="logo">Dolphinator</div>
    <div class="time-spent" id="timeSpent">loading...</div>

    <div class="search-container">
        <input id="searchInput" placeholder="Search games..." onkeyup="searchGames()">
    </div>
</header>

<main>
    <div class="section-title">Audio & Media</div>
    <div class="games-grid" id="apps-grid"></div>

    <div class="section-title">Games</div>
    <div class="games-grid" id="all-games-grid"></div>
</main>

<footer>
    © <span id="year"></span> Dolphinator
</footer>

<script>
/* ================= SIDEBAR ================= */
document.querySelector('.sidebar-toggle').onclick = () => {
    document.querySelector('.sidebar').classList.toggle('expanded');
};

/* ================= LOAD DATA ================= */
async function loadGames() {
    try {
        const res = await fetch('games.json');
        const data = await res.json();
        return data.games || [];
    } catch {
        return [];
    }
}

async function loadApps() {
    try {
        const res = await fetch('apps.json');
        const data = await res.json();
        return data.apps || [];
    } catch {
        return [];
    }
}

/* ================= FAVORITES ================= */
function getFavorites() {
    return JSON.parse(localStorage.getItem('favoriteGames') || '[]');
}

function saveFavorites(favs) {
    localStorage.setItem('favoriteGames', JSON.stringify(favs));
}

function toggleFavorite(e, game) {
    e.stopPropagation();
    let favs = getFavorites();
    const index = favs.findIndex(f => f.path === game.path);

    if (index === -1) favs.push(game);
    else favs.splice(index, 1);

    saveFavorites(favs);
    renderGames(window.ALL_GAMES);
}

/* ================= SELECT GAME ================= */
function toggleSelect(card, game) {
    card.classList.toggle('selected');
}

/* ================= RENDER ================= */
function renderApps(apps) {
    const grid = document.getElementById('apps-grid');
    grid.innerHTML = '';

    for (const app of apps) {
        const card = document.createElement('div');
        card.className = 'game-card';

        card.innerHTML = `
            <a href="${app.path}" target="_blank">
                <img src="${app.image}" class="game-card-image">
                <div class="game-card-title">${app.title}</div>
            </a>
        `;

        grid.appendChild(card);
    }
}

function renderGames(games) {
    const grid = document.getElementById('all-games-grid');
    grid.innerHTML = '';
    const favs = getFavorites();

    for (const game of games) {
        const isFav = favs.some(f => f.path === game.path);
        const card = document.createElement('div');
        card.className = 'game-card';

        card.innerHTML = `
            <a href="${game.path}" target="_blank">
                <img src="${game.image}" class="game-card-image">
                <div class="game-card-title">${game.title}</div>
            </a>
            <div class="favorite-star ${isFav ? 'active' : ''}">
                <i class="fa${isFav ? 's' : 'r'} fa-star"></i>
            </div>
        `;

        card.querySelector('.favorite-star').onclick = (e) =>
            toggleFavorite(e, game);

        card.onclick = () => toggleSelect(card, game);

        grid.appendChild(card);
    }
}

/* ================= SEARCH ================= */
function searchGames() {
    const q = searchInput.value.toLowerCase();
    renderGames(window.ALL_GAMES.filter(g =>
        g.title.toLowerCase().includes(q)
    ));
}

/* ================= TIME ================= */
let seconds = Number(localStorage.getItem('time') || 0);
setInterval(() => {
    seconds++;
    localStorage.setItem('time', seconds);
    timeSpent.textContent = seconds + ' seconds';
}, 1000);

/* ================= INIT ================= */
document.getElementById('year').textContent = new Date().getFullYear();

(async () => {
    window.ALL_APPS = await loadApps();
    renderApps(window.ALL_APPS);

    window.ALL_GAMES = await loadGames();
    renderGames(window.ALL_GAMES);
})();
</script>

</body>
</html>
